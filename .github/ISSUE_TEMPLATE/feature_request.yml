name: Feature request
description: Suggest an improvement within OSS scope (see implementation-audit)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I read docs/implementation-audit.md — this fits local OSS, not hosted-only LLM/MCP
          required: true